<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق SnapFilter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #111;
            color: #fff;
            margin: 0;
            padding: 20px;
        }
        h2 { color: #ff4757; }
        video, canvas {
            width: 100%;
            max-width: 400px;
            border-radius: 10px;
            border: 2px solid #444;
            margin-bottom: 10px;
        }
        .btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn:active { background: #ff6b81; }
        #status { margin-top: 15px; font-size: 16px; color: #2ed573; }
    </style>
</head>
<body>

    <h2>SnapFilter - كاميرا الفلتر</h2>
    
    <!-- عرض الكاميرا الحية -->
    <div>
        <video id="video" autoplay playsinline></video>
    </div>

    <!-- زر التقاط الصورة -->
    <div>
        <button class="btn" id="capture-btn">التقاط الصورة وإرسالها</button>
    </div>

    <p id="status"></p>

    <!-- Canvas مخفي لمعالجة الصورة -->
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const captureBtn = document.getElementById('capture-btn');
        const statusText = document.getElementById('status');

        // فتح كاميرا الموبايل الأمامية أو الخلفية
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
            .then(stream => {
                video.srcObject = stream;
            })
            .catch(err => {
                console.error("خطأ في تشغيل الكاميرا: ", err);
                statusText.innerText = "تعذر الوصول إلى الكاميرا!";
                statusText.style.color = "#ff4757";
            });

        // عند الضغط على زر التقاط الصورة
        captureBtn.addEventListener('click', () => {
            canvas.width = video.videoWidth || 400;
            canvas.height = video.videoHeight || 400;
            const ctx = canvas.getContext('2d');
            
            // رسم لقطة من الفيديو على الـ Canvas
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // تحويل الصورة إلى صيغة Base64
            const imageData = canvas.toDataURL('image/png');

            statusText.innerText = "جاري إرسال الصورة إلى لوحة التحكم...";

            // إرسال الصورة إلى السيرفر
            fetch('/upload-snapshot', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ image: imageData })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    statusText.innerText = "تم التقاط الصورة وإرسالها بنجاح! تحقق من صفحة الـ Admin";
                } else {
                    statusText.innerText = "فشل في حفظ الصورة على السيرفر.";
                    statusText.style.color = "#ff4757";
                }
            })
            .catch(error => {
                console.error('خطأ:', error);
                statusText.innerText = "حدث خطأ أثناء الاتصال بالسيرفر.";
                statusText.style.color = "#ff4757";
            });
        });
    </script>

</body>
</html>
