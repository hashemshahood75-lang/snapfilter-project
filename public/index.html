<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapFilter - تجربة الفلتر</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d0f12;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: #161922;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid #262b3d;
        }
        h2 {
            font-size: 22px;
            margin-bottom: 15px;
            color: #ff4757;
            font-weight: 700;
        }
        .filter-preview-box {
            position: relative;
            width: 100%;
            border-radius: 14px;
            overflow: hidden;
            background: linear-gradient(135deg, #1f4068, #162447);
            aspect-ratio: 3/4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px dashed #ff4757;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }
        .filter-preview-box p {
            font-size: 16px;
            color: #dcdde1;
            margin-top: 10px;
            font-weight: bold;
        }
        .filter-icon {
            font-size: 50px;
        }
        .btn-capture {
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: white;
            border: none;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            font-size: 22px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn-capture:active {
            transform: scale(0.92);
        }
        #toast {
            visibility: hidden;
            min-width: 220px;
            background-color: #2ed573;
            color: white;
            text-align: center;
            border-radius: 8px;
            padding: 12px;
            position: fixed;
            bottom: 30px;
            font-size: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            z-index: 1000;
            transition: visibility 0.3s, opacity 0.3s ease-in-out;
            opacity: 0;
        }
        #toast.show {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>SnapFilter - تجربة الفلتر</h2>
        
        <div class="filter-preview-box" id="filterBox">
            <div class="filter-icon">✨🎭</div>
            <p>فلتر الأمان الرقمي نشط</p>
        </div>

        <button class="btn-capture" id="capture-btn" title="التقاط وتجربة">
            📸
        </button>
    </div>

    <div id="toast">تم التقاط وإرسال تجربة الفلتر بنجاح! 🚀</div>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const captureBtn = document.getElementById('capture-btn');
        const toast = document.getElementById('toast');
        const canvas = document.getElementById('canvas');

        function showToast(message, bgColor = "#2ed573") {
            toast.innerText = message;
            toast.style.backgroundColor = bgColor;
            toast.className = "show";
            setTimeout(() => {
                toast.className = toast.className.replace("show", "");
            }, 3000);
        }

        captureBtn.addEventListener('click', () => {
            canvas.width = 600;
            canvas.height = 800;
            const ctx = canvas.getContext('2d');

            let gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, "#ff4757");
            gradient.addColorStop(1, "#2f3542");
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 40px Arial";
            ctx.textAlign = "center";
            ctx.fillText("SnapFilter Captured", canvas.width / 2, 350);
            
            ctx.font = "24px Arial";
            ctx.fillText("الوقت: " + new Date().toLocaleTimeString(), canvas.width / 2, 420);

            const imageData = canvas.toDataURL('image/png');

            showToast("جاري الإرسال...", "#f39c12");

            fetch('/upload-snapshot', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ image: imageData })
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(data => {
                if (data.success) {
                    showToast("تم إرسال الصورة للوحة التحكم بنجاح! 🚀");
                } else {
                    showToast("فشل الحفظ على السيرفر", "#ff4757");
                }
            })
            .catch(err => {
                console.error('Fetch Error:', err);
                showToast("خطأ في الاتصال بالخادم", "#ff4757");
            });
        });
    </script>

</body>
</html>
