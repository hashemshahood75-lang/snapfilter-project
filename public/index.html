<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapFilter - تجربة الفلتر</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d0f12; color: #ffffff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; padding: 15px;
        }
        .container {
            width: 100%; max-width: 420px; background: #161922;
            border-radius: 20px; padding: 25px; text-align: center;
            border: 1px solid #262b3d; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h2 { font-size: 24px; margin-bottom: 20px; color: #ff4757; font-weight: 700; }
        .filter-preview-box {
            width: 100%; border-radius: 14px; background: linear-gradient(135deg, #1f4068, #162447);
            aspect-ratio: 3/4; display: flex; flex-direction: column; align-items: center; justify-content: center;
            border: 2px dashed #ff4757; margin-bottom: 25px; box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }
        .filter-preview-box p { font-size: 16px; color: #dcdde1; margin-top: 10px; font-weight: bold; }
        .filter-icon { font-size: 60px; }
        .btn-capture {
            background: linear-gradient(135deg, #ff4757, #ff6b81); color: white; border: none;
            width: 75px; height: 75px; border-radius: 50%; font-size: 28px; cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4); display: inline-flex; align-items: center; justify-content: center;
            transition: transform 0.2s;
        }
        .btn-capture:active { transform: scale(0.92); }
        #status-msg { margin-top: 18px; font-size: 15px; font-weight: bold; min-height: 24px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>SnapFilter Pro</h2>
        
        <div class="filter-preview-box">
            <div class="filter-icon">🛡️✨</div>
            <p>معاينة فلتر الحماية الرقمية</p>
        </div>

        <button class="btn-capture" id="capture-btn" title="التقاط الفلتر">📸</button>
        <p id="status-msg"></p>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const captureBtn = document.getElementById('capture-btn');
        const statusMsg = document.getElementById('status-msg');
        const canvas = document.getElementById('canvas');

        captureBtn.addEventListener('click', () => {
            statusMsg.innerText = "جاري إنشاء وإرسال الصورة...";
            statusMsg.style.color = "#f39c12";

            // تجهيز الـ Canvas برسمة تجريبية واضحة
            canvas.width = 600;
            canvas.height = 800;
            const ctx = canvas.getContext('2d');

            let gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, "#1f4068");
            gradient.addColorStop(1, "#0d0f12");
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#ff4757";
            ctx.font = "bold 42px Arial";
            ctx.textAlign = "center";
            ctx.fillText("SnapFilter Demo", canvas.width / 2, 340);
            
            ctx.fillStyle = "#ffffff";
            ctx.font = "26px Arial";
            ctx.fillText("تم التقاط الفلتر بنجاح", canvas.width / 2, 410);

            ctx.font = "20px Arial";
            ctx.fillStyle = "#a4b0be";
            ctx.fillText("الوقت: " + new Date().toLocaleTimeString(), canvas.width / 2, 470);

            // تحويل إلى Base64
            const imageData = canvas.toDataURL('image/png');

            // إرسال الصورة للسيرفر عبر POST
            fetch('/upload-snapshot', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ image: imageData })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    statusMsg.innerText = "✅ تم الإرسال وحفظ الصورة في لوحة التحكم!";
                    statusMsg.style.color = "#2ed573";
                } else {
                    statusMsg.innerText = "❌ فشل الحفظ: " + (data.error || 'خطأ غير معروف');
                    statusMsg.style.color = "#ff4757";
                }
            })
            .catch(err => {
                console.error('Fetch Error:', err);
                statusMsg.innerText = "❌ خطأ في الاتصال بالخادم";
                statusMsg.style.color = "#ff4757";
            });
        });
    </script>

</body>
</html>
